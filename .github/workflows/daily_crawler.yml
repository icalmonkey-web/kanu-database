name: 自動更新信用卡資料庫 (Playwright + AI)

on:
  schedule:
    - cron: '0 18 * * *' # 每天台灣時間凌晨 02:00
  workflow_dispatch:      # 支援手動點擊執行
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/daily_crawler.yml'

concurrency:
  group: bank-crawler
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 簽出程式碼倉庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件與 Playwright 瀏覽器
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests playwright httpx
          playwright install chromium --with-deps

      - name: 嘗試恢復上次中斷的 Checkpoint（沒有舊檔時直接略過）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoints
          restored="false"
          for previous_run in $(gh run list --workflow daily_crawler.yml --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf .checkpoint-download
            if gh run download "$previous_run" -n bank-crawl-report -D .checkpoint-download 2>/dev/null; then
              mapfile -t checkpoint_files < <(find .checkpoint-download -type f -name '*.json')
              if [ "${#checkpoint_files[@]}" -gt 0 ]; then
                cp "${checkpoint_files[@]}" checkpoints/
                restored="true"
                echo "已從執行 $previous_run 恢復 checkpoint。"
                break
              fi
            fi
          done
          if [ "$restored" != "true" ]; then
            echo "沒有可恢復的 checkpoint，從目前 data.json 開始。"
          fi

      - name: 執行資料結構化
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_PAGES_PER_BANK: '40'
          MAX_CRAWL_DEPTH: '3'
          BANK_CONCURRENCY: '4'
          PAGE_TIMEOUT_SECONDS: '25'
          AI_TIMEOUT_MILLISECONDS: '45000'
          CRAWL_BUDGET_SECONDS: '4200'
        run: |
          mkdir -p checkpoints
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/fast_update.py

      - name: 保留掃描與缺口報告（無論成功失敗皆保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-crawl-report
          path: |
            crawl_report.json
            checkpoints/
          if-no-files-found: ignore

      - name: 檢查並發布更新至 data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main
          git add data.json crawler_state.json crawl_report.json
          if git diff --staged --quiet; then
            echo "資料庫無變更。"
          else
            git commit -m "chore: 自動更新信用卡權益與登錄活動資料庫 [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "✅ 成功發布最新資料！"
                exit 0
              fi
              echo "遠端在推送前再次更新，重新整合（第 ${attempt} 次）..."
              git fetch origin main
              git rebase origin/main
            done
            echo "❌ 重試 3 次仍無法發布，拒絕強制覆蓋遠端。"
            exit 1
          fi
