name: 自動更新信用卡資料庫 (Playwright + AI)

on:
  schedule:
    - cron: '0 18 * * *' # 每天台灣時間凌晨 02:00
  workflow_dispatch:      # 支援手動點擊執行
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/daily_crawler.yml'

concurrency:
  group: bank-crawler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 簽出程式碼倉庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件與 Playwright 瀏覽器
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests playwright
          playwright install chromium --with-deps

      - name: 執行資料結構化
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_PAGES_PER_BANK: '60'
          MAX_CRAWL_DEPTH: '3'
          MAX_DYNAMIC_EXPANSIONS: '3'
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/update_data.py

      - name: 保留掃描與缺口報告（失敗也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-crawl-report
          path: crawl_report.json
          if-no-files-found: warn

      - name: 檢查並發布更新至 data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 掃描可能跑數小時；期間若有人更新 main，先保留產出的 JSON，
          # 快轉到最新遠端後再套回，避免 non-fast-forward。
          git pull --rebase --autostash origin main
          git add data.json crawler_state.json crawl_report.json
          if git diff --staged --quiet; then
            echo "資料庫無變更。"
          else
            git commit -m "chore: 自動更新信用卡權益與登錄活動資料庫 [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "✅ 成功發布最新資料！"
                exit 0
              fi
              echo "遠端在推送前再次更新，重新整合（第 ${attempt} 次）..."
              git fetch origin main
              git rebase origin/main
            done
            echo "❌ 重試 3 次仍無法發布，拒絕強制覆蓋遠端。"
            exit 1
          fi
