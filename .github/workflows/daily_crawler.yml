name: 每日自動更新銀行回饋資料庫

on:
  schedule:
    - cron: '0 20 * * *' # 台灣時間每天凌晨 4:00 自動執行
  workflow_dispatch: # 支援手動隨時點擊一鍵執行

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴庫
        run: pip install requests google-generativeai

      - name: 執行 AI 爬蟲與資料結構化
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/update_data.py

      - name: 若資料庫有異動則自動 Commit 並發布
        run: |
          git config --global user.name "Kanu-Bot"
          git config --global user.email "bot@kanu.app"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bank rules $(date +'%Y-%m-%d')" && git push)
