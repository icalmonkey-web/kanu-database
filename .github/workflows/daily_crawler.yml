name: 自動更新信用卡資料庫 (Playwright + AI)

on:
  schedule:
    - cron: '0 18 * * *' # 每天台灣時間凌晨 02:00 自動執行 (UTC 18:00)
  workflow_dispatch:      # 支援手動點擊按鈕立即執行

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼倉庫
        uses: actions/checkout@v4

      - name: 設定 Python 執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝 Python 套件與 Playwright 瀏覽器
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests playwright
          # 安裝無頭 Chromium 瀏覽器及其系統相依套件
          playwright install chromium --with-deps

      - name: 執行 Playwright 渲染爬蟲與 AI 資料結構化
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/update_data.py

      - name: 檢查並發布更新至 data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "資料庫內容無變更，跳過 Commit。"
          else
            git commit -m "chore: 自動更新信用卡權益與登錄活動資料庫 [skip ci]"
            git push
            echo "✅ 成功將最新資料發布至 GitHub！"
          fi
